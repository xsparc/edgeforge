name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements/onnx-api.txt
      - run: python -m pip install --no-deps -e .
      - run: python -c "import onnx, onnxruntime, fastapi"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_governance.py --strict
      - run: python scripts/export_schemas.py
      - run: git diff --exit-code -- schemas
      - run: python -m build
  executorch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install "torch==2.14.0" "executorch==1.5.1" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pip install -e ".[dev,executorch]"
      - run: python -c "import torch; import executorch.runtime"
      - run: python -m pytest tests/test_executorch.py -q
